<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/kcal-tracken/favicon.svg" />
    <link rel="apple-touch-icon" href="/kcal-tracken/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <!-- Must track --color-bg in index.css: this paints the browser/PWA chrome
         around the app, so a stale value here shows as a grey strip above a
         warm page — the one place the palette can't be fixed from CSS. -->
    <meta name="theme-color" content="#faf7f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141210" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tracke" />
    <meta name="description" content="Ernährungstracker: Mahlzeiten per Text, Diktat oder Foto erfassen, KI schätzt die Nährwerte." />
    <title>Tracke</title>
    <!-- Fraunces: the one display face, used only for the day-shape number and
         page titles (see index.css's --font-display) — never for body/data
         text, which stays on the system font per HIG ("minimize the number
         of typefaces you use"). Preconnect first so the actual stylesheet
         request doesn't pay the DNS+TLS cost separately. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
