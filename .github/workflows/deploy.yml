name: Deploy to GitHub Pages

on:
  push:
    # claude/nutrition-tracker-app-k9vdjn added temporarily for a one-off
    # live preview deploy of the rebrand work, at the user's explicit
    # request ("Mach es live" -> temporär auf die echte Live-URL). Reverted
    # in a follow-up commit right after the deploy completes.
    branches: [main, claude/nutrition-tracker-app-k9vdjn]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
