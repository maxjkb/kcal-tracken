<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Global brainstorm round (v2.1): replaces the old blue-gradient
       concentric-ring icon with the app's own "t" mark — the same
       lowercase glyph the ambient background tiles (AmbientBackground.tsx),
       drawn as plain vector geometry rather than <text>/a webfont so it
       renders identically wherever the OS rasterizes it (home screen, share
       sheet, browser tab) without depending on Unbounded being loaded.
       Solid ink background + a light "t" — deliberately monochrome, unlike
       the background pattern's scattered macro-colored letters: an icon
       has to read correctly at 16px, where a color accent risks vanishing
       or reading as noise; the pattern is seen at a scale where it can
       afford the richer texture. -->
  <defs>
    <clipPath id="frame"><rect width="512" height="512" rx="114.176"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="512" height="512" fill="#101114"/>
    <path
      d="M 218 96 L 282 96 L 282 150 L 372 150 L 372 214 L 282 214 L 282 330
         C 282 366 300 384 332 384 C 348 384 362 380 372 372 L 372 358
         C 372 358 388 372 388 400 C 388 428 358 448 320 448
         C 258 448 218 410 218 340 L 218 214 L 172 214 L 172 150 L 218 150 Z"
      fill="#fbfbf9"
    />
  </g>
</svg>
